<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ThemeMusic 交互回归测试</title>
  <link rel="stylesheet" href="../assets/ucwc-music.css">
  <style>
    :root {
      --dashboard-background-color: #1f242d;
      --dashboard-border-color: #3a424f;
      --dashboard-icon-color: #d6dce8;
      --dashboard-title-action-color: rgba(255,255,255,.1);
      --text-color: #eef2f8;
    }
    body { margin: 20px; color: var(--text-color); background: #11151b; font: 14px Arial,sans-serif; }
    #fixture-actions { display:flex; gap:8px; margin-bottom:16px; }
    table.dashboard { width:min(720px,100%); border-collapse:collapse; }
    table.dashboard > tbody { display:table-row-group; background:var(--dashboard-background-color); border:1px solid var(--dashboard-border-color); }
    table.dashboard > tbody > tr > td { padding:0; }
    i.tile { display:none; }
  </style>
  <script>
    var fixtureParams = new URLSearchParams(location.search);
    if (fixtureParams.get("reset") === "1") {
      ["desktop", "mobile"].forEach(function (profile) {
        sessionStorage.removeItem("ucwc_music_library_v2_" + profile + "_local:default");
        sessionStorage.removeItem("ucwc_music_play_v1_" + profile + "_local:default");
        localStorage.removeItem("ucwc_music_play_v1_" + profile + "_local:default");
        localStorage.removeItem("ucwc_music_v1_" + profile);
      });
      sessionStorage.removeItem("ucwc_music_library_v2");
      sessionStorage.removeItem("ucwc_music_play_v1");
      localStorage.removeItem("ucwc_music_play_v1");
      localStorage.removeItem("ucwc_music_v1");
    }
    window.__fixtureListFetchCount = 0;
    window.__fixtureAudioPlayCount = 0;
    window.__fixtureAudioPauseCount = 0;
    function updateAudioCounters() {
      var out = document.getElementById("fixture-audio-count");
      if (out) {
        out.textContent = "音频调用：play=" + window.__fixtureAudioPlayCount + " pause=" + window.__fixtureAudioPauseCount;
      }
    }
    var fixtureAudioMode = fixtureParams.get("audio");
    if (fixtureAudioMode === "mock" || fixtureAudioMode === "blocked") {
      window.Audio = function FixtureAudio() {
        var target = new EventTarget();
        target.paused = true;
        target.currentTime = 0;
        target.duration = 180;
        target.readyState = 0;
        target.volume = 0.7;
        target.muted = false;
        target.error = null;
        target.src = "";
        target.style = { cssText: "" };
        target.setAttribute = function () {};
        target.removeAttribute = function (name) { if (name === "src") target.src = ""; };
        target.load = function () {
          target.readyState = 4;
          setTimeout(function () {
            target.dispatchEvent(new Event("loadedmetadata"));
            target.dispatchEvent(new Event("canplay"));
          }, 0);
        };
        target.play = function () {
          window.__fixtureAudioPlayCount += 1;
          updateAudioCounters();
          if (fixtureAudioMode === "blocked") {
            return Promise.reject(new DOMException("play() requires user interaction", "NotAllowedError"));
          }
          return new Promise(function (resolve) {
            setTimeout(function () {
              if (target.paused) {
                target.paused = false;
                target.dispatchEvent(new Event("play"));
              }
              resolve();
            }, 80);
          });
        };
        target.pause = function () {
          if (!target.paused) {
            window.__fixtureAudioPauseCount += 1;
            target.paused = true;
            target.dispatchEvent(new Event("pause"));
            updateAudioCounters();
          }
        };
        return target;
      };
    }
    var fixtureRunMode = fixtureParams.get("mode");
    if (fixtureRunMode !== "chip" && fixtureRunMode !== "both") fixtureRunMode = "card";
    if (fixtureParams.get("resume") === "1") {
      var resumePayload = JSON.stringify({playing:true,intent:true,index:0,t:12,id:"a.mp3",vol:0.7,sitewide:fixtureRunMode !== "card",ts:Date.now()});
      sessionStorage.setItem("ucwc_music_play_v1", resumePayload);
      localStorage.setItem("ucwc_music_play_v1", resumePayload);
    }
    window.__UCWC_MUSIC__ = {
      enable: true,
      source: fixtureParams.get("source") === "navidrome" ? "navidrome" : "local",
      run_mode: fixtureRunMode,
      volume: 70,
      autoplay: false,
      shuffle: false,
      repeat: "off"
    };
    window.fetch = function (url) {
      var isList = String(url).indexOf("action=list") >= 0;
      if (isList) {
        window.__fixtureListFetchCount += 1;
        var counter = document.getElementById("fixture-fetch-count");
        if (counter) counter.textContent = "曲库请求：" + window.__fixtureListFetchCount;
      }
      var body = isList
        ? {ok:true,tracks:[
            {id:window.__UCWC_MUSIC__.source === "navidrome" ? "nd:song-a" : "a.mp3",title:"测试歌曲 A",artist:"测试歌手",album:"测试专辑",ext:"mp3",size:1024},
            {id:window.__UCWC_MUSIC__.source === "navidrome" ? "nd:song-b" : "b.mp3",title:"测试歌曲 B",artist:"测试歌手",album:"测试专辑",ext:"mp3",size:2048}
          ]}
        : {ok:false};
      return Promise.resolve({ok:true,json:function(){return Promise.resolve(body);}});
    };
  </script>
</head>
<body>
  <div id="fixture-actions">
    <button id="fixture-clone" type="button">模拟 Unraid 重绘</button>
    <button id="fixture-manage" type="button">模拟关闭键注入</button>
    <button id="fixture-pagehide" type="button">模拟页面隐藏</button>
    <output id="fixture-drag-count">拖拽冒泡：0</output>
    <output id="fixture-fetch-count">曲库请求：0</output>
    <output id="fixture-audio-count">音频调用：play=0 pause=0</output>
  </div>
  <table id="db_box1" class="dashboard"></table>
  <script src="../assets/ucwc-music.js"></script>
  <script>
    (function () {
      var dragCount = 0;
      var table = document.getElementById("db_box1");
      window.fixtureToggleArrow = function (icon) {
        icon.classList.toggle("fa-chevron-up");
        icon.classList.toggle("fa-chevron-down");
      };
      function installNativeControls() {
        var host = document.getElementById("ucwc-music-dash-host");
        var card = document.getElementById("ucwc-music-card");
        if (!host || !card) return false;
        var cell = host.querySelector("tr:first-child > td:first-child");
        var controls = card.querySelector(".tile-header-right-controls");
        if (!cell || !controls) return false;
        if (!cell.querySelector(":scope > i.control.tile")) {
          var dismiss = document.createElement("i");
          dismiss.className = "fa fa-fw fa-close control tile";
          dismiss.title = "关闭磁贴";
          dismiss.textContent = "×";
          cell.insertBefore(dismiss, cell.firstChild);
        }
        if (!controls.querySelector(".openclose")) {
          var arrow = document.createElement("i");
          arrow.className = "fa fa-fw fa-chevron-up control openclose";
          arrow.title = "显示/隐藏内容";
          arrow.textContent = "⌃";
          arrow.setAttribute("onclick", "fixtureToggleArrow(this)");
          controls.appendChild(arrow);
        }
        return true;
      }
      var nativeTimer = setInterval(function () {
        if (installNativeControls()) clearInterval(nativeTimer);
      }, 50);
      ["pointerdown", "mousedown", "touchstart"].forEach(function (type) {
        table.addEventListener(type, function () {
          dragCount += 1;
          document.getElementById("fixture-drag-count").textContent = "拖拽冒泡：" + dragCount;
        });
      });
      document.getElementById("fixture-clone").addEventListener("click", function () {
        var card = document.getElementById("ucwc-music-card");
        if (!card || !card.parentNode) return;
        card.parentNode.replaceChild(card.cloneNode(true), card);
      });
      document.getElementById("fixture-manage").addEventListener("click", function () {
        var host = document.getElementById("ucwc-music-dash-host");
        var cell = host && host.querySelector("tr:first-child > td:first-child");
        if (!cell || cell.querySelector(":scope > i.control.tile")) return;
        var dismiss = document.createElement("i");
        dismiss.className = "fa fa-fw fa-close control tile";
        dismiss.title = "关闭磁贴";
        dismiss.textContent = "×";
        cell.insertBefore(dismiss, cell.firstChild);
      });
      document.getElementById("fixture-pagehide").addEventListener("click", function () {
        window.dispatchEvent(new Event("pagehide"));
      });
    })();
  </script>
</body>
</html>
