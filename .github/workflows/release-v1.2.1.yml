name: 发布 Theme Music v1.2.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.2.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验当前版本
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("versions/index.json"))["latest_version"])')"
          ./scripts/verify-release.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 构建发布产物
        run: |
          set -euo pipefail
          ./scripts/build-release.sh "${{ steps.version.outputs.version }}" snapshot

      - name: 提交完整 v${{ steps.version.outputs.version }}
        id: commit
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md PLUGIN-README.md CHANGELOG.md \
            theme.music.plg versions/index.json "versions/$version" \
            scripts/verify-release.sh
          git diff --cached --quiet || git commit -m "发布 Theme Music ${version}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 创建正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version 已存在，跳过。"
            exit 0
          fi
          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]]|$)" {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          gh release create "$version" \
            "dist/$version/ThemeMusic-$version.zip" \
            "dist/$version/ThemeMusic-$version.tar.gz" \
            "dist/$version/theme.music-$version.plg" \
            "dist/$version/files.manifest" \
            "dist/$version/install.sh" \
            "dist/$version/SHA256SUMS" \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "Theme Music $version" \
            --notes-file release-notes.md \
            --latest