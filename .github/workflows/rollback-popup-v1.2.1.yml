name: 生成 v1.2.1 无小窗版本

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rollback-popup-v1.2.1.yml

permissions:
  contents: write

jobs:
  rollback-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 恢复页面内播放器并保留 v1.2.0 功能
        run: |
          set -euo pipefail
          BASE_NO_POPUP=39614de19383a73198831138aea649f89a526207
          BASE_V120=cdafa2aae909d676d8957649d9790f046d47e4d5
          V120=110ccc6ff7e0e3ba25d6c0b53b0393040db1ec89

          git show "$BASE_NO_POPUP:assets/ucwc-music.js" > assets/ucwc-music.js
          git diff "$BASE_V120" "$V120" -- assets/ucwc-music.js > /tmp/v120-player.patch
          patch -p1 --forward --fuzz=3 < /tmp/v120-player.patch

          ! grep -q 'window.open' assets/ucwc-music.js
          ! grep -q 'ucwc_theme_music_host_v2' assets/ucwc-music.js
          ! grep -q 'persistentHost' assets/ucwc-music.js
          grep -q 'listRenderLimit: 300' assets/ucwc-music.js
          grep -q 'LYRIC_DRIFT_KEY' assets/ucwc-music.js

          rm -f assets/ucwc-music-host.html
          python3 - <<'PY'
          import json, pathlib, re
          version='v1.2.1'

          for name in ['scripts/build-release.sh','scripts/install.sh','scripts/verify-release.sh']:
              p=pathlib.Path(name)
              s=p.read_text()
              s='\n'.join(line for line in s.splitlines() if 'assets/ucwc-music-host.html' not in line)+'\n'
              p.write_text(s)

          p=pathlib.Path('versions/index.json')
          j=json.loads(p.read_text())
          for x in j['versions']:
              if x.get('channel')=='latest': x['channel']='stable'
          j['default']=j['latest_version']=version
          j['versions']=[x for x in j['versions'] if x.get('id')!=version]
          j['versions'].insert(0,{'id':version,'label':'正式版 v1.2.1：移除独立小窗音频宿主；音乐胶囊恢复页面内播放；保留大曲库索引与歌词校准','channel':'latest','released_at':'2026-08-01','music':True,'ota':True})
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')

          p=pathlib.Path('README.md'); s=p.read_text(); s=s.replace('当前正式版：**v1.2.0**','当前正式版：**v1.2.1**').replace('install v1.2.0 ota','install v1.2.1 ota'); p.write_text(s)
          p=pathlib.Path('CHANGELOG.md'); s=p.read_text(); entry='''## v1.2.1 — 2026-08-01\n\n### 音乐胶囊取消独立小窗\n- 移除固定名称的独立音频宿主窗口及其 BroadcastChannel、心跳、启动锁和跨窗口控制链路\n- 音乐胶囊恢复使用当前 Unraid 页面内的隐藏 audio 播放器，不再弹出额外窗口或标签页\n- 保留 v1.2.0 的后台完整曲库索引、300 首分段渲染、歌词时间校准和低负载扫描\n\n'''; s=s.replace('# Theme Music Changelog\n\n','# Theme Music Changelog\n\n'+entry,1); p.write_text(s)

          p=pathlib.Path('theme.music.plg'); s=p.read_text(); s=re.sub(r'(<!ENTITY\s+version\s+")[^"]+(">)',r'\g<1>v1.2.1\2',s,count=1); s=re.sub(r'(<!ENTITY\s+ver\s+")[^"]+(">)',r'\g<1>v1.2.1\2',s,count=1); marker='\t\t## Theme Music\n'; note='\t\t### v1.2.1\n\t\t- 音乐胶囊取消独立小窗，恢复当前页面内播放\n\t\t- 保留 v1.2.0 的完整曲库索引、分段渲染和歌词校准\n'; s=s.replace(marker,marker+note,1); p.write_text(s)
          PY

          ./scripts/build-release.sh v1.2.1 snapshot
          ./scripts/verify-release.sh
          ./scripts/verify-release.sh v1.2.1

      - name: 提交并触发正式构建
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '发布 Theme Music v1.2.1：移除音乐胶囊独立小窗'
          git push origin HEAD:main
