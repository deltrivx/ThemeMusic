name: 发布完整性检查

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    outputs:
      version: ${{ steps.build.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（包含正式版本 tags）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 构建并校验当前版本
        id: build
        run: |
          version="$(python3 -c 'import json; print(json.load(open("versions/index.json"))["latest_version"])')"
          ./scripts/verify-release.sh
          ./scripts/build-release.sh "$version" snapshot
          git diff --exit-code -- "versions/$version"
          ./scripts/verify-release.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ThemeMusic-${{ steps.build.outputs.version }}
          path: dist/${{ steps.build.outputs.version }}/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载已验证产物
        uses: actions/download-artifact@v4
        with:
          name: ThemeMusic-${{ needs.verify.outputs.version }}
          path: release-assets
      - name: 创建正式 Release（已存在则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，跳过。"
            exit 0
          fi
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          assets=()
          while IFS= read -r -d '' asset; do assets+=("$asset"); done < <(find release-assets -maxdepth 1 -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "$VERSION" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Theme Music $VERSION" \
            --notes-file release-notes.md \
            --latest
