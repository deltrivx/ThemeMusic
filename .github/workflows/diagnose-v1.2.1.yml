name: 诊断 Theme Music v1.2.1 构建

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-v1.2.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 抽取并执行发布生成步骤
        id: reproduce
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/release-v1.2.1.yml').read_text(encoding='utf-8')
          start_marker = '      - name: 生成 v1.2.1 源码与完整版本元数据\n        run: |\n'
          end_marker = '\n      - name: 提交完整 v1.2.1\n'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('无法定位发布生成步骤')
          block = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/reproduce-v121.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          chmod +x /tmp/reproduce-v121.sh
          set +e
          bash -x /tmp/reproduce-v121.sh > /tmp/v121-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/v121-build.log
          exit "$status"

      - name: 回写诊断日志
        if: always()
        run: |
          {
            echo '# Theme Music v1.2.1 构建诊断'
            echo
            echo "退出码：${{ steps.reproduce.outputs.exit_code }}"
            echo
            echo '```text'
            cat /tmp/v121-build.log 2>/dev/null || echo '未生成日志'
            echo '```'
          } > .github/v1.2.1-build-failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v1.2.1-build-failure.md
          git commit -m '记录 v1.2.1 构建失败日志' || exit 0
          git push origin HEAD:main

      - name: 标记诊断失败
        if: steps.reproduce.outcome == 'failure'
        run: exit 1
